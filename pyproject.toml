[project]
name = "causeval"
version = "0.0.1"
description = "A statistically rigorous, causal evaluation layer for LLM apps, built on top of DeepEval."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "causeval authors" }]
keywords = ["llm", "evaluation", "deepeval", "causal", "statistics", "uncertainty"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "deepeval>=4.2,<5",
    "pydantic>=2.5,<3",
    "numpy>=1.24",
    "scipy>=1.10",
    "tenacity>=8.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
nli = ["transformers>=4.40", "torch>=2.0"]
irt = ["girth>=0.8"]
ppi = ["ppi-python>=0.1"]
observational = ["dowhy>=0.11", "econml>=0.15"]

[project.scripts]
causeval = "causeval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causeval"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# python_version tracks the interpreter mypy runs under (3.12): numpy 2.x's type stubs use
# `type` alias syntax that mypy rejects when targeting < 3.12. Runtime 3.10 compatibility is
# enforced by ruff (target-version = py310) and the CI test matrix, not here.
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/causeval"]
plugins = ["pydantic.mypy"]

# deepeval ships py.typed but is only partially typed; treat it as untyped (Any) so strict
# mode does not flag calls into its untyped internals. We read its source directly (rule 9).
[[tool.mypy.overrides]]
module = ["deepeval.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*", "girth.*", "ppi_py.*", "dowhy.*", "econml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that make real LLM calls (needs API keys); excluded by default",
    "sim: statistical simulation tests with known ground truth",
]
addopts = "-q"
